<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha solicitação | Empréstimo Fácil</title><style>
:root{color-scheme:light;--green:#075c47;--text:#173c32;--muted:#60766e;--line:#dce7e0}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,sans-serif;background:#f4f8f5;color:var(--text)}main{max-width:740px;margin:40px auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}a{color:var(--green)}h1{font-size:clamp(26px,5vw,34px);line-height:1.2}h2{font-size:22px}p{color:var(--muted)}section,form{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:20px}label{display:block;font-weight:600;margin:18px 0}input{display:block;width:100%;margin-top:7px;padding:13px;font:inherit;border:1px solid #acbfb2;border-radius:9px;min-width:0}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #dfac43;outline-offset:3px}button{background:var(--green);color:white;padding:13px 20px;border:0;border-radius:10px;font:600 16px system-ui;cursor:pointer;min-height:46px}button:disabled{opacity:.6;cursor:wait}.secondary{background:white;color:var(--green);border:1px solid var(--line)}dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px 20px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}#message{color:#963920}[hidden]{display:none!important}.badge{display:inline-block;background:#e7f2eb;color:var(--green);font-weight:600;border-radius:30px;padding:6px 12px}#notice{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:540px){main{padding:18px;margin:12px auto}section,form{padding:20px}header{margin-bottom:22px}dl{grid-template-columns:1fr;gap:5px}dd{margin-bottom:12px}}
</style></head><body><main><header><strong>Empréstimo Fácil</strong><a href="/">Voltar ao site</a></header><h1>Minha solicitação</h1><p>Acompanhe o pré-cadastro recebido usando o protocolo e a senha escolhida no cadastro.</p><p id="message" role="status" aria-live="polite"></p><form id="login"><h2>Entrar</h2><label>Protocolo do pré-cadastro<input name="application_id" required maxlength="36" autocomplete="off" placeholder="Protocolo recebido após o envio"></label><label>E-mail do cadastro<input name="email" type="email" required maxlength="254" autocomplete="username"></label><label>Senha<input name="password" type="password" required minlength="7" maxlength="128" autocomplete="current-password"></label><button type="submit">Acompanhar solicitação</button></form><section id="panel" hidden><span class="badge" id="state"></span><h2 id="greeting"></h2><dl id="summary"></dl><p id="notice"></p><p>O recebimento do cadastro e sua revisão não representam aprovação ou liberação de crédito.</p><button id="refresh" class="secondary" type="button">Atualizar</button> <button id="logout" class="secondary" type="button">Sair</button></section></main><script>
(()=>{'use strict';const d=document,login=d.getElementById('login'),panel=d.getElementById('panel'),msg=d.getElementById('message');const states={received:'Recebido',under_review:'Em análise',information_requested:'Complemento solicitado',closed:'Análise encerrada'};async function api(path,options={}){const response=await fetch('/api/client/'+path,{...options,credentials:'same-origin',cache:'no-store',redirect:'error',headers:{'Content-Type':'application/json'}});let data;try{data=await response.json();}catch{}if(!response.ok){if(response.status===401)clear();throw Error(typeof data?.detail==='string'?data.detail:'Não foi possível acessar sua solicitação.');}return data;}function clear(){login.hidden=false;panel.hidden=true;d.getElementById('summary').replaceChildren();d.getElementById('greeting').textContent='';d.getElementById('notice').textContent='';d.getElementById('state').textContent='';}async function load(){const data=await api('application');login.hidden=true;panel.hidden=false;d.getElementById('greeting').textContent='Olá, '+data.first_name;d.getElementById('state').textContent=states[data.review.state]||'Recebido';d.getElementById('notice').textContent=data.review.message||'Sua solicitação foi recebida e aguarda conferência.';const summary=d.getElementById('summary');summary.replaceChildren();for(const [title,value] of [['Protocolo',data.application_id],['CPF',data.cpf_masked],['Valor solicitado',new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(data.loan.amount_requested)],['Parcelamento',data.loan.installments_requested+' parcelas semanais'],['Recebimento',new Date(data.received_at).toLocaleString('pt-BR')]]){const dt=d.createElement('dt'),dd=d.createElement('dd');dt.textContent=title;dd.textContent=value;summary.append(dt,dd);}msg.textContent='';}login.addEventListener('submit',async event=>{event.preventDefault();const button=login.querySelector('button');button.disabled=true;try{await api('login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(login)))});login.reset();await load();}catch(error){msg.textContent=error.message;}finally{button.disabled=false;login.elements.password.value='';}});d.getElementById('refresh').addEventListener('click',()=>load().catch(error=>msg.textContent=error.message));d.getElementById('logout').addEventListener('click',async()=>{try{await api('logout',{method:'POST',body:'{}'});clear();msg.textContent='Sessão encerrada.';}catch(error){msg.textContent=error.message;}});load().catch(error=>{if(!error.message.startsWith('Entre para'))msg.textContent=error.message;});})();
</script></body></html>
